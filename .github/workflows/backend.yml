name: Backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "deploy/release.sh", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rollandplay
          POSTGRES_USER: rollandplay
          POSTGRES_PASSWORD: rollandplay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rollandplay -d rollandplay"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://rollandplay:rollandplay@localhost:5432/rollandplay?sslmode=disable
      REDIS_ADDR: localhost:6379
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test ./...
      - name: Build linux/amd64 binaries
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags "-s -w" -o ../dist/backend/server ./cmd/server
          go build -trimpath -ldflags "-s -w" -o ../dist/backend/migrate ./cmd/migrate
      - uses: actions/upload-artifact@v4
        with:
          name: backend
          path: dist/backend
          retention-days: 7

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy
      - uses: actions/download-artifact@v4
        with:
          name: backend
          path: dist/backend
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $DEPLOY_HOST
            Port $DEPLOY_PORT
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts ~/.ssh/config
      - name: Upload and activate release
        run: |
          chmod 755 dist/backend/server dist/backend/migrate
          rsync -az --delete dist/backend/ "vps:/opt/rollandplay/backend/releases/$GITHUB_SHA/"
          ssh vps bash -s -- backend "$GITHUB_SHA" < deploy/release.sh
